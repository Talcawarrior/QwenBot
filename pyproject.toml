[project]
name = "qwenbot"
version = "4.0.0"
requires-python = ">=3.12"

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", ".ruff_cache", ".mypy_cache", "logs", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "S101",   # use of assert (tests need it)
    "S603",   # subprocess call - check for untrusted input
    "S607",   # start process with partial path
    "RUF001", # ambiguous chars (Turkish ı, ş, ğ — intentional)
    "RUF002", # ambiguous chars in docstrings (Turkish)
    "RUF003", # ambiguous chars in comments (Turkish)
    "RUF059", # unused unpacked variables (common in test fixtures)
    "PT009",  # unittest-style assertions (existing tests)
    "PT018",  # compound assertions (existing tests)
    "PT015",  # assert False (existing tests)
    "PT017",  # assertion on exception (existing tests)
    "S110",   # try-except-pass (intentional in many places)
    "S112",   # try-except-continue (intentional in loops)
    "S311",   # pseudo-random (not for crypto, intentional)
    "S104",   # binding to all interfaces (0.0.0.0 is correct)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT009", "PT015", "PT017", "PT018", "RUF059"]
"config/settings.py" = ["E501"]
"main.py" = ["F841"]
"historical_simulator.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false   # gradual: not strict yet
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "__pycache__",
    ".git",
    "logs",
    "data",
    ".mypy_cache",
    ".ruff_cache",
]

# ── Pyright ─────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["config", "engine", "executor", "scrapers", "utils", "database", "jobs", "tools", "asi_engine"]
exclude = ["__pycache__", ".git", "logs", "data", "tests"]
reportMissingImports = false
reportMissingTypeStubs = false
reportPrivateUsage = false

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: marks tests that hit real APIs (deselect with '-m \"not live\"')",
]

# ── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["config", "engine", "executor", "scrapers", "utils", "database", "jobs"]
omit = ["tests/*", "data/*", "logs/*", "asi_engine/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "pass",
    "except Exception",
    "raise NotImplementedError",
]
